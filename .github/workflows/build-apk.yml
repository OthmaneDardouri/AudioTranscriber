name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Il runner ha già l'Android SDK: accettiamo solo le licenze (servono per scaricare NDK e CMake).
      - name: Licenze Android SDK
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          echo "Uso $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true

      - name: Scarica whisper.cpp
        run: git clone --depth 1 --branch v1.7.4 https://github.com/ggml-org/whisper.cpp app/src/main/cpp/whisper.cpp

      - uses: gradle/actions/setup-gradle@v4

      - name: Compila APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Rinomina APK
        run: cp app/build/outputs/apk/release/app-release.apk VocaleAI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: VocaleAI-apk
          path: VocaleAI.apk

      # Pubblica l'APK in Releases → "latest": comodo da scaricare dal telefono.
      - name: Pubblica release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest VocaleAI.apk \
            --title "Vocale AI · build ${{ github.run_number }}" \
            --notes "APK compilato automaticamente dal commit ${{ github.sha }}. Scarica VocaleAI.apk e installalo."
